<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Cash — конвертер валют (ЦБ РФ)</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      /* Приятная тёмная палитра (Slate) */
      --bg-main: #0f172a;
      --bg-panel: #1e293b;
      --bg-input: #0f172a;
      --border-color: #334155;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --msg-result-bg: #1e293b;
      --msg-error-bg: #451a1a;
      --msg-error-text: #fca5a5;
      --msg-warn-bg: #422006;
      --msg-warn-text: #fcd34d;
      --help-bg: #1e293b;
      --help-border: #3b82f6;

      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #output-container {
      flex: 1;
      background: var(--bg-panel);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #output {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Стили для сообщений */
    .msg {
      font-size: 0.95rem;
      line-height: 1.4;
      padding: 10px 14px;
      border-radius: 12px;
      word-break: break-word;
      animation: fadeIn 0.2s ease-out;
    }

    .msg-result {
      background: var(--msg-result-bg);
      border: 1px solid var(--border-color);
      align-self: flex-start;
      font-weight: 500;
      font-size: 1.05rem;
    }

    .msg-error {
      background: var(--msg-error-bg);
      color: var(--msg-error-text);
      align-self: flex-start;
    }

    .msg-warn {
      background: var(--msg-warn-bg);
      color: var(--msg-warn-text);
      font-size: 0.85rem;
    }

    .msg-info {
      color: var(--text-muted);
      padding: 4px 0;
      background: none;
      font-size: 0.9rem;
    }

    /* Красивая карточка для справки */
    .help-card {
      background: var(--help-bg);
      border-left: 4px solid var(--help-border);
      padding: 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .help-card h3 {
      margin: 0 0 10px 0;
      font-size: 1rem;
      color: #fff;
    }

    .help-card p {
      margin: 0 0 8px 0;
    }

    .help-card code {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #93c5fd;
    }

    .help-card ul {
      padding-left: 20px;
      margin: 0;
    }

    .help-card li {
      margin-bottom: 4px;
    }

    /* Поле ввода */
    #input-row {
      display: flex;
      gap: 10px;
      background: var(--bg-panel);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    #input::placeholder {
      color: var(--text-muted);
    }

    #send {
      padding: 0 20px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send:hover {
      background: var(--accent-hover);
    }

    #send:active {
      transform: scale(0.96);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>💱 Cash — курсы ЦБ РФ</h1>
  </header>

  <div id="output-container">
    <div id="output"></div>
  </div>

  <div id="input-row">
    <input id="input" type="text" placeholder="100 USD to RUB или help" autocomplete="off" autocapitalize="off"
      spellcheck="false">
    <button id="send">→</button>
  </div>

  <script src="./app.js"></script>
</body>

</html>
