<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Cash — конвертер валют (ЦБ РФ)</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.2rem;
      margin: 0 0 12px;
      font-weight: 600;
    }

    #output {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 14px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    #output .err {
      color: #f87171;
    }

    #output .warn {
      color: #fbbf24;
    }

    #output .info {
      color: #94a3b8;
    }

    #input-row {
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }

    #input:focus {
      border-color: #38bdf8;
    }

    #send {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      background: #0ea5e9;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    #send:active {
      background: #0284c7;
    }
  </style>
</head>

<body>
  <h1>💱 Cash — курсы ЦБ РФ</h1>
  <div id="output"></div>
  <div id="input-row">
    <input id="input" type="text" placeholder="100 USD to RUB или help" autocomplete="off" autocapitalize="off"
      spellcheck="false">
    <button id="send">→</button>
  </div>
  <script src="/app.js"></script>
</body>

</html>
